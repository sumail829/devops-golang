on:  
  push: 
   branches: 
     - main

jobs:
  Build-Go-Artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up Go environment
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.16'
      - name: Download Go modules
        run: go mod download
      - name: run build
        run: go build -v ./..

